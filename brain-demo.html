<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iridescent Brain · Three.js</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #c8c8cb; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

// Scene setup
const scene = new THREE.Scene();
scene.background = new THREE.Color('#c8c8cb');

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 1, 5000);
camera.position.set(0, 0, 900);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// Iridescent material — MeshPhysicalMaterial with iridescence
function makeIridescentMaterial() {
  return new THREE.MeshPhysicalMaterial({
    color: 0xf0f0f5,
    metalness: 0.3,
    roughness: 0.15,
    transmission: 0.0,
    thickness: 1.2,
    ior: 1.45,
    iridescence: 1.0,
    iridescenceIOR: 1.3,
    iridescenceThicknessRange: [100, 800],
    clearcoat: 0.6,
    clearcoatRoughness: 0.05,
    sheen: 0.4,
    sheenColor: new THREE.Color('#ffd0e8'),
    sheenRoughness: 0.4,
    envMapIntensity: 1.5,
  });
}

// Brain lobes — 22 small clustered spheres
const lobeSpecs = [
  { x: -85, y: -110, z: 35, r: 65 },
  { x:  85, y: -110, z: 35, r: 65 },
  { x: -50, y: -130, z: -20, r: 55 },
  { x:  50, y: -130, z: -20, r: 55 },
  { x: -125, y: 0, z: 30, r: 75 },
  { x:  125, y: 0, z: 30, r: 75 },
  { x: -80, y: 30, z: -40, r: 60 },
  { x:  80, y: 30, z: -40, r: 60 },
  { x: -90, y: 100, z: 20, r: 65 },
  { x:  90, y: 100, z: 20, r: 65 },
  { x: -40, y: 130, z: -30, r: 50 },
  { x:  40, y: 130, z: -30, r: 50 },
  { x: 0, y: 50, z: -90, r: 70 },
  { x: -30, y: 80, z: -60, r: 55 },
  { x:  30, y: 80, z: -60, r: 55 },
  { x: 0, y: -150, z: 0, r: 60 },
  { x: -20, y: -130, z: -50, r: 45 },
  { x:  20, y: -130, z: -50, r: 45 },
  { x: -145, y: 40, z: -10, r: 45 },
  { x:  145, y: 40, z: -10, r: 45 },
  { x: -100, y: -70, z: 60, r: 50 },
  { x:  100, y: -70, z: 60, r: 50 },
];

// Brain stem — cascading smaller spheres
const stemSpecs = [
  { x: 0, y: 175, z: -40, r: 45 },
  { x: 0, y: 220, z: -50, r: 35 },
  { x: 0, y: 260, z: -55, r: 28 },
  { x: 0, y: 295, z: -58, r: 22 },
  { x: 0, y: 325, z: -60, r: 16 },
];

// Environment map for PBR reflections (procedural)
const pmremGenerator = new THREE.PMREMGenerator(renderer);

// Create a procedural environment: gradient + bright spots for highlights
function makeEnvTexture() {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = size * 2;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  // Base: pale lavender gradient
  const grad = ctx.createLinearGradient(0, 0, 0, size);
  grad.addColorStop(0, '#ffd0e8');  // pink top
  grad.addColorStop(0.5, '#e8d8ff'); // lavender middle
  grad.addColorStop(1, '#d0e0ff');  // blue bottom
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size * 2, size);

  // Bright hot spots for specular reflections
  const lights = [
    { x: size * 0.25, y: size * 0.2, r: 60, c: '#ffffff' },
    { x: size * 0.6, y: size * 0.35, r: 50, c: '#fff5f8' },
    { x: size * 1.4, y: size * 0.25, r: 55, c: '#f8f0ff' },
    { x: size * 1.7, y: size * 0.7, r: 45, c: '#ffe8d0' },
  ];
  for (const l of lights) {
    const rg = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r);
    rg.addColorStop(0, l.c);
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, size * 2, size);
  }

  const tex = new THREE.CanvasTexture(canvas);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  return pmremGenerator.fromEquirectangular(tex).texture;
}

scene.environment = makeEnvTexture();

// Build brain
const brainGroup = new THREE.Group();

for (const spec of lobeSpecs) {
  const geom = new THREE.SphereGeometry(spec.r, 48, 48);
  const mat = makeIridescentMaterial();
  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.set(spec.x, spec.y, spec.z);
  brainGroup.add(mesh);
}

for (const spec of stemSpecs) {
  const geom = new THREE.SphereGeometry(spec.r, 32, 32);
  const mat = makeIridescentMaterial();
  mat.color.setHex(0xe8e0f5);
  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.set(spec.x, spec.y, spec.z);
  brainGroup.add(mesh);
}

// Small accent dots scattered on top — the bright specular hits
const accentSpecs = [
  { x: -100, y: -80, z: 80, r: 12 },
  { x:  100, y: -80, z: 80, r: 12 },
  { x: 0, y: -110, z: 60, r: 14 },
  { x: -50, y: 80, z: 50, r: 10 },
  { x:  50, y: 80, z: 50, r: 10 },
];
for (const spec of accentSpecs) {
  const geom = new THREE.SphereGeometry(spec.r, 24, 24);
  const mat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    emissive: 0xffffff,
    emissiveIntensity: 0.8,
    metalness: 0.9,
    roughness: 0.0,
  });
  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.set(spec.x, spec.y, spec.z);
  brainGroup.add(mesh);
}

scene.add(brainGroup);

// Lights
const ambient = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambient);

const dir1 = new THREE.DirectionalLight(0xffe0f0, 1.2);
dir1.position.set(-300, 400, 500);
scene.add(dir1);

const dir2 = new THREE.DirectionalLight(0xc0d0ff, 1.0);
dir2.position.set(400, -200, 300);
scene.add(dir2);

const dir3 = new THREE.DirectionalLight(0xfff5e0, 0.8);
dir3.position.set(0, -500, 200);
scene.add(dir3);

// Drag interaction
let dragX = 0, dragY = -0.05;
let targetX = 0, targetY = -0.05;
let isDragging = false;
let lastX = 0, lastY = 0;

renderer.domElement.addEventListener('mousedown', (e) => {
  isDragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});
window.addEventListener('mouseup', () => { isDragging = false; });
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  targetX += dx * 0.008;
  targetY += dy * 0.005;
  targetY = Math.max(-0.6, Math.min(0.6, targetY));
  lastX = e.clientX;
  lastY = e.clientY;
});

// Touch
renderer.domElement.addEventListener('touchstart', (e) => {
  isDragging = true;
  lastX = e.touches[0].clientX;
  lastY = e.touches[0].clientY;
});
window.addEventListener('touchend', () => { isDragging = false; });
window.addEventListener('touchmove', (e) => {
  if (!isDragging) return;
  const dx = e.touches[0].clientX - lastX;
  const dy = e.touches[0].clientY - lastY;
  targetX += dx * 0.008;
  targetY += dy * 0.005;
  targetY = Math.max(-0.6, Math.min(0.6, targetY));
  lastX = e.touches[0].clientX;
  lastY = e.touches[0].clientY;
});

// Animate
function animate() {
  requestAnimationFrame(animate);
  dragX += (targetX - dragX) * 0.08;
  dragY += (targetY - dragY) * 0.08;

  const t = performance.now() * 0.001;
  const breath = Math.sin(t * 0.7) * 0.008;

  brainGroup.rotation.y = dragX;
  brainGroup.rotation.x = dragY - 0.05;
  brainGroup.scale.setScalar(1 + breath);

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iridescent Brain · Three.js</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #c8c8cb; }
  canvas { display: block; }
</style>
</head>
<body>
<script src="https://unpkg.com/three@0.150.0/build/three.min.js"></script>
<script>
// Three.js r128 — global THREE, no module loading required

(function(){
  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#c8c8cb');

  const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 1, 5000);
  camera.position.set(0, 0, 800);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.appendChild(renderer.domElement);

  // Iridescent glass material — MeshPhysicalMaterial with transmission for glass bubbles
  function makeIridescent() {
    return new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      metalness: 0.0,
      roughness: 0.05,
      transmission: 0.9,         // glass-like transparency
      thickness: 1.5,
      ior: 1.4,
      iridescence: 1.0,
      iridescenceIOR: 1.3,
      iridescenceThicknessRange: [200, 800],
      clearcoat: 1.0,
      clearcoatRoughness: 0.0,
      attenuationColor: new THREE.Color('#fff0f8'),
      attenuationDistance: 4,
      sheen: 0.6,
      sheenColor: new THREE.Color('#ffb8e0'),
      sheenRoughness: 0.3,
      envMapIntensity: 2.0,
    });
  }

  // Procedural environment map — bright spots for highlights
  function makeEnvTexture() {
    const size = 512;
    const canvas = document.createElement('canvas');
    canvas.width = size * 2;
    canvas.height = size;
    const ctx = canvas.getContext('2d');

    // Pale lavender/pink/blue gradient
    const grad = ctx.createLinearGradient(0, 0, 0, size);
    grad.addColorStop(0, '#ffd0e8');
    grad.addColorStop(0.5, '#e8d8ff');
    grad.addColorStop(1, '#d0e0ff');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size * 2, size);

    // Bright hot spots for specular reflections
    const lights = [
      { x: size * 0.25, y: size * 0.2, r: 90, c: '#ffffff' },
      { x: size * 0.6, y: size * 0.35, r: 70, c: '#fff5f8' },
      { x: size * 1.4, y: size * 0.25, r: 75, c: '#f8f0ff' },
      { x: size * 1.7, y: size * 0.7, r: 60, c: '#ffe8d0' },
    ];
    for (const l of lights) {
      const rg = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r);
      rg.addColorStop(0, l.c);
      rg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(0, 0, size * 2, size);
    }

    const tex = new THREE.CanvasTexture(canvas);
    tex.mapping = THREE.EquirectangularReflectionMapping;
    return tex;
  }

  const envTex = makeEnvTexture();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(envTex).texture;

  // Brain glass bubbles — 49 small clustered spheres for metaball-like glass blob effect
  const lobeSpecs = [
    // Top crown
    { x: 90, y: -140, z: 0, r: 28 },
    { x: 83, y: -132, z: 21, r: 33 },
    { x: 64, y: -126, z: 30, r: 28 },
    { x: 34, y: -122, z: 21, r: 33 },
    { x: 0, y: -120, z: 0, r: 28 },
    { x: -34, y: -122, z: -21, r: 33 },
    { x: -64, y: -126, z: -30, r: 28 },
    { x: -83, y: -132, z: -21, r: 33 },
    // Upper-left cluster
    { x: -95, y: -100, z: 30, r: 32 },
    { x: -110, y: -75, z: 25, r: 36 },
    { x: -100, y: -50, z: 50, r: 30 },
    { x: -85, y: -25, z: 35, r: 34 },
    { x: -75, y: 0, z: 60, r: 28 },
    // Upper-right cluster
    { x: 95, y: -100, z: 30, r: 32 },
    { x: 110, y: -75, z: 25, r: 36 },
    { x: 100, y: -50, z: 50, r: 30 },
    { x: 85, y: -25, z: 35, r: 34 },
    { x: 75, y: 0, z: 60, r: 28 },
    // Mid-left (widest)
    { x: -115, y: -30, z: 20, r: 37 },
    { x: -125, y: 0, z: 10, r: 40 },
    { x: -120, y: 25, z: -5, r: 36 },
    { x: -110, y: 55, z: 5, r: 34 },
    { x: -100, y: 80, z: -10, r: 32 },
    // Mid-right
    { x: 115, y: -30, z: 20, r: 37 },
    { x: 125, y: 0, z: 10, r: 40 },
    { x: 120, y: 25, z: -5, r: 36 },
    { x: 110, y: 55, z: 5, r: 34 },
    { x: 100, y: 80, z: -10, r: 32 },
    // Lower-left
    { x: -90, y: 80, z: 25, r: 32 },
    { x: -75, y: 105, z: 15, r: 30 },
    { x: -55, y: 125, z: 25, r: 28 },
    { x: -30, y: 140, z: 10, r: 26 },
    { x: -10, y: 150, z: 0, r: 24 },
    // Lower-right
    { x: 90, y: 80, z: 25, r: 32 },
    { x: 75, y: 105, z: 15, r: 30 },
    { x: 55, y: 125, z: 25, r: 28 },
    { x: 30, y: 140, z: 10, r: 26 },
    { x: 10, y: 150, z: 0, r: 24 },
    // Back lobe
    { x: 0, y: 30, z: -75, r: 35 },
    { x: -25, y: 55, z: -60, r: 30 },
    { x: 25, y: 55, z: -60, r: 30 },
    { x: -15, y: 90, z: -45, r: 26 },
    { x: 15, y: 90, z: -45, r: 26 },
    // Front bumps
    { x: -20, y: -40, z: 50, r: 26 },
    { x: 20, y: -40, z: 50, r: 26 },
    { x: 0, y: -60, z: 60, r: 28 },
    { x: -40, y: -15, z: 55, r: 24 },
    { x: 40, y: -15, z: 55, r: 24 },
  ];

  // Brain stem — cascading smaller glass bubbles
  const stemSpecs = [
    { x: 0, y: 170, z: -40, r: 32 },
    { x: 0, y: 200, z: -50, r: 26 },
    { x: 0, y: 225, z: -55, r: 22 },
    { x: 0, y: 248, z: -58, r: 18 },
    { x: 0, y: 268, z: -60, r: 14 },
  ];

  // Build brain
  const brainGroup = new THREE.Group();

  for (const spec of lobeSpecs) {
    const geom = new THREE.SphereGeometry(spec.r, 48, 48);
    const mat = makeIridescent();
    const mesh = new THREE.Mesh(geom, mat);
    mesh.position.set(spec.x, spec.y, spec.z);
    brainGroup.add(mesh);
  }

  for (const spec of stemSpecs) {
    const geom = new THREE.SphereGeometry(spec.r, 32, 32);
    const mat = makeIridescent();
    mat.color = new THREE.Color(0xe8e0f5);
    const mesh = new THREE.Mesh(geom, mat);
    mesh.position.set(spec.x, spec.y, spec.z);
    brainGroup.add(mesh);
  }

  // Small bright accent dots on top — the highlights
  const accentSpecs = [
    { x: -100, y: -80, z: 80, r: 12 },
    { x:  100, y: -80, z: 80, r: 12 },
    { x: 0, y: -110, z: 60, r: 14 },
    { x: -50, y: 80, z: 50, r: 10 },
    { x:  50, y: 80, z: 50, r: 10 },
  ];
  for (const spec of accentSpecs) {
    const geom = new THREE.SphereGeometry(spec.r, 24, 24);
    const mat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0xffffff,
      emissiveIntensity: 0.9,
      metalness: 0.9,
      roughness: 0.0,
    });
    const mesh = new THREE.Mesh(geom, mat);
    mesh.position.set(spec.x, spec.y, spec.z);
    brainGroup.add(mesh);
  }

  scene.add(brainGroup);

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.4));

  const dir1 = new THREE.DirectionalLight(0xffe0f0, 1.4);
  dir1.position.set(-300, 400, 500);
  scene.add(dir1);

  const dir2 = new THREE.DirectionalLight(0xc0d0ff, 1.2);
  dir2.position.set(400, -200, 300);
  scene.add(dir2);

  const dir3 = new THREE.DirectionalLight(0xfff5e0, 0.9);
  dir3.position.set(0, -500, 200);
  scene.add(dir3);

  // Drag interaction
  let dragX = 0, dragY = -0.05, targetX = 0, targetY = -0.05;
  let isDragging = false, lastX = 0, lastY = 0;

  renderer.domElement.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
  });
  window.addEventListener('mouseup', () => { isDragging = false; });
  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    targetX += dx * 0.008;
    targetY += dy * 0.005;
    targetY = Math.max(-0.6, Math.min(0.6, targetY));
    lastX = e.clientX;
    lastY = e.clientY;
  });
  renderer.domElement.addEventListener('touchstart', (e) => {
    isDragging = true;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  });
  window.addEventListener('touchend', () => { isDragging = false; });
  window.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    const dx = e.touches[0].clientX - lastX;
    const dy = e.touches[0].clientY - lastY;
    targetX += dx * 0.008;
    targetY += dy * 0.005;
    targetY = Math.max(-0.6, Math.min(0.6, targetY));
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  });

  // Animate
  function animate() {
    requestAnimationFrame(animate);
    dragX += (targetX - dragX) * 0.08;
    dragY += (targetY - dragY) * 0.08;

    const t = performance.now() * 0.001;
    const breath = Math.sin(t * 0.7) * 0.008;

    brainGroup.rotation.y = dragX;
    brainGroup.rotation.x = dragY - 0.05;
    brainGroup.scale.setScalar(1 + breath);

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
})();
</script>
</body>
</html>
